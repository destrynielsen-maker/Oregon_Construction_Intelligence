name: Collect Oregon permits and publish

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/data/**"
      - "public/feeds/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oregon-permits-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Collect permits and generate outputs
        env:
          PYTHONPATH: src
        run: python -m oregon_permits.main
      - name: Save updated permit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/permits.json public/data public/feeds
          if ! git diff --cached --quiet; then
            git commit -m "Update Oregon permit intelligence"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
