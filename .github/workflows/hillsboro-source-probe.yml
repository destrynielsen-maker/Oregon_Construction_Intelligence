name: Hillsboro source probe

on:
  push:
    branches: [expand-oregon-hillsboro]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - name: Inspect Hillsboro inspection-history permit API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from urllib.parse import urljoin
          import re, requests
          from bs4 import BeautifulSoup

          BASE='https://inspections.hillsboro-oregon.gov/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          s=requests.Session();s.headers.update({'User-Agent':UA})
          r=s.get(BASE,timeout=90);r.raise_for_status();soup=BeautifulSoup(r.text,'html.parser')
          print('HOME',r.status_code,'BYTES',len(r.content),'TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
          print('FORMS')
          for f in soup.find_all('form'): print(str(f)[:5000])
          print('SCRIPT_SRCS')
          srcs=[]
          for script in soup.find_all('script',src=True):
              u=urljoin(BASE,script['src'])
              if u not in srcs:srcs.append(u)
              print(u)
          print('INLINE_RELEVANT')
          for script in soup.find_all('script'):
              body=script.get_text('\n',strip=True)
              if re.search(r'(fetch|ajax|permit|inspection|api|search)',body,re.I): print(body[:12000])
          key=re.compile(r'(fetch\(|axios|ajax|/api/|permit|inspection|search)',re.I)
          for u in srcs:
              try:
                  rr=s.get(u,headers={'Referer':BASE},timeout=90);rr.raise_for_status();text=rr.text
              except Exception as exc:
                  print('FAIL',u,exc);continue
              hits=list(key.finditer(text))
              if not hits:continue
              print('\n=== SCRIPT',u,'BYTES',len(rr.content),'HITS',len(hits),'===')
              for m in hits[:120]:
                  a=max(0,m.start()-1000);b=min(len(text),m.end()+2500)
                  print(text[a:b].replace('\n',' ')[:3500])
          # Probe likely paths without assuming success.
          for path in ['api','swagger','swagger/index.html','openapi.json','api/permits','api/inspections','api/search']:
              u=urljoin(BASE,path)
              try:
                  rr=s.get(u,headers={'Referer':BASE},timeout=30)
                  print('PROBE',u,'HTTP',rr.status_code,'TYPE',rr.headers.get('content-type'),'BYTES',len(rr.content),'HEAD',repr(rr.text[:300]))
              except Exception as exc: print('PROBE_FAIL',u,type(exc).__name__,exc)
          PY
