name: Hillsboro source probe

on:
  push:
    branches: [expand-oregon-hillsboro]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Probe Hillsboro Accela API gateway
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests, json
          BASE='https://api.hillsboro-oregon.gov/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Referer':'https://inspections.hillsboro-oregon.gov/'})
          paths=[
            '', 'swagger', 'swagger/index.html', 'swagger/v1/swagger.json', 'openapi.json',
            'Api/Accela/Address/Search?Address=1820%20NE%2012TH%25',
            'Api/Accela/Permit/Search?PermitNumber=STR26-0548',
            'Api/Accela/Permit/Search?permit_number=STR26-0548',
            'Api/Accela/Permit/Detail?PermitNumber=STR26-0548',
            'Api/Accela/Permit/Details?PermitNumber=STR26-0548',
            'Api/Accela/Permits/Search?PermitNumber=STR26-0548',
            'Api/Accela/Record/Search?RecordNumber=STR26-0548',
            'Api/Accela/Records/Search?RecordNumber=STR26-0548',
            'Api/Accela/Inspection/Search?PermitNumber=STR26-0548',
            'Api/Accela/Inspections/Search?PermitNumber=STR26-0548',
          ]
          for path in paths:
              u=BASE+path
              try:
                  r=s.get(u,timeout=45,allow_redirects=True)
                  ctype=r.headers.get('content-type','')
                  print('\nURL',u,'FINAL',r.url,'HTTP',r.status_code,'TYPE',ctype,'BYTES',len(r.content))
                  print('BODY',repr(r.text[:3500]))
              except Exception as exc: print('FAIL',u,type(exc).__name__,exc)
          # OPTIONS on the known working namespace and likely record paths can reveal allowed verbs/routes.
          for path in ['Api/Accela/Address/Search','Api/Accela/Permit/Search','Api/Accela/Permit/Detail','Api/Accela/Record/Search']:
              u=BASE+path
              try:
                  r=s.options(u,timeout=30)
                  print('OPTIONS',u,r.status_code,'ALLOW',r.headers.get('allow'),'BODY',repr(r.text[:1000]))
              except Exception as exc: print('OPTIONS_FAIL',u,exc)
          PY
