name: Hillsboro branch validation

on:
  push:
    branches: [expand-oregon-hillsboro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hillsboro-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Inspect bounded Hillsboro detail sample
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from oregon_permits.collectors.hillsboro import HillsboroCollector
          from oregon_permits.collectors.base import new_session

          collector = HillsboroCollector()
          session = new_session()
          today = date.today()
          rows = collector._search_window(session, today - timedelta(days=21), today)
          if rows is None:
              raise SystemExit("Hillsboro search window failed")

          structural = [r for r in rows if collector.structural_re.search(r.get("record_type") or "")]
          print("ROWS", len(rows), "STRUCTURAL", len(structural))
          preferred = [r for r in structural if r.get("permit_number") == "STR26-0552"]
          sample = (preferred + [r for r in structural if r.get("permit_number") != "STR26-0552"])[:3]
          if not sample:
              raise SystemExit("No Hillsboro structural records available for detail validation")

          parsed = 0
          for row in sample:
              try:
                  detail = collector._detail(session, row["source_url"])
              except Exception as exc:
                  print("DETAIL_FAIL", row["permit_number"], type(exc).__name__, str(exc))
                  continue
              subtype = detail.get("subtype")
              is_new = bool(subtype and collector.new_subtype_re.search(subtype))
              parsed += 1
              print("DETAIL", row["permit_number"], "STATUS", row.get("status"), "SUBTYPE", repr(subtype), "NEW", is_new)

          print("PARSED_SAMPLE", parsed, "OF", len(sample))
          if parsed == 0:
              raise SystemExit("Bounded Hillsboro detail sample could not be parsed")
          PY
