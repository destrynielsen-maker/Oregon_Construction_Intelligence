name: Hillsboro branch validation

on:
  push:
    branches: [expand-oregon-hillsboro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hillsboro-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run current-window Hillsboro collector
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from oregon_permits.classify import classify_permit
          from oregon_permits.collectors.hillsboro import HillsboroCollector

          collector = HillsboroCollector()
          collector.windows = 1
          result = collector.collect()
          permits = result.permits
          for permit in permits:
              classify_permit(permit)

          validated = [p for p in permits if (p.raw or {}).get("source_issued_validated") is True]
          qualifying = [p for p in permits if p.qualifies]
          invalid = [p.permit_number for p in qualifying if (p.raw or {}).get("source_issued_validated") is not True]

          print("SOURCE", result.source)
          print("CANDIDATES", len(permits))
          print("VALIDATED_ISSUED", len(validated))
          print("QUALIFYING", len(qualifying))
          print("CLASSIFICATIONS", dict(Counter(p.classification for p in qualifying)))
          print("STATUSES", dict(Counter((p.status or "UNKNOWN") for p in permits)))
          print("SUBTYPES", dict(Counter((p.raw or {}).get("subtype") or "UNKNOWN" for p in permits)))
          print("INVALID_PUBLISHED", invalid)
          for p in permits:
              print("PERMIT", p.permit_number, "STATUS", p.status, "SUBTYPE", (p.raw or {}).get("subtype"), "ISSUED_VALIDATED", (p.raw or {}).get("source_issued_validated"), "QUALIFIES", p.qualifies, "CLASS", p.classification)

          if invalid:
              raise SystemExit("Hillsboro safety invariant failed: unvalidated permit qualified")
          if not permits:
              raise SystemExit("Hillsboro current-window collector returned no new-construction candidates")
          PY
