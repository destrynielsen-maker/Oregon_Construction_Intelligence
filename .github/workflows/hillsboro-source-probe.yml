name: Hillsboro branch validation

on:
  push:
    branches: [expand-oregon-hillsboro]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compare live Hillsboro search payloads
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from collections import Counter
          from bs4 import BeautifulSoup
          from oregon_permits.collectors.hillsboro import HillsboroCollector
          from oregon_permits.collectors.base import new_session

          collector = HillsboroCollector()
          session = new_session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"})
          today = date.today()
          start = today - timedelta(days=21)

          first = session.get(collector.search_url, timeout=90)
          first.raise_for_status()
          soup = BeautifulSoup(first.text, "html.parser")
          payload = collector._successful_controls(soup)
          payload.update({
              "__EVENTTARGET": "ctl00$PlaceHolderMain$btnNewSearch",
              "__EVENTARGUMENT": "",
              "ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate": collector._form_date(start),
              "ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate": collector._form_date(today),
              "ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate_ext_ClientState": "",
              "ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate_ext_ClientState": "",
          })
          posted = session.post(
              collector.search_url,
              data=payload,
              headers={"Referer": collector.search_url, "Origin": "https://aca-prod.accela.com"},
              timeout=120,
          )
          posted.raise_for_status()
          exact_soup = BeautifulSoup(posted.text, "html.parser")
          exact_rows = collector._parse_result_rows(exact_soup)
          exact_structural = [r for r in exact_rows if collector.structural_re.search(r.get("record_type") or "")]
          print("EXACT_ROWS_PAGE1", len(exact_rows))
          print("EXACT_STRUCTURAL_PAGE1", len(exact_structural))
          print("EXACT_STATUSES", dict(Counter(r.get("status") for r in exact_rows)))
          for row in exact_structural:
              print("EXACT_STRUCTURAL", row["permit_number"], row["status"], row["record_type"])

          current_rows = collector._search_window(new_session(), start, today)
          print("CURRENT_SEARCH_ROWS", None if current_rows is None else len(current_rows))
          if current_rows is not None:
              print("CURRENT_STRUCTURAL", sum(bool(collector.structural_re.search(r.get("record_type") or "")) for r in current_rows))

          if exact_rows and not current_rows:
              raise SystemExit("Confirmed collector payload mismatch: exact search returns records while current collector returns none")
          PY
