name: Hillsboro source probe

on:
  push:
    branches: [expand-oregon-hillsboro]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4
      - name: Inspect older Hillsboro structural issuance states
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from urllib.parse import urljoin
          from collections import Counter
          import re, requests
          from bs4 import BeautifulSoup

          BASE='https://aca-prod.accela.com/HILLSBORO/'
          SEARCH=urljoin(BASE,'Cap/CapHome.aspx?TabName=Building&module=Building')
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':UA})

          def controls(soup):
              form=soup.find('form',id='aspnetForm')
              if not form: raise RuntimeError('aspnetForm not found')
              p={}
              for inp in form.find_all('input'):
                  name=inp.get('name'); typ=(inp.get('type') or 'text').lower()
                  if not name or typ in {'submit','button','image','file'}: continue
                  if typ in {'checkbox','radio'} and not inp.has_attr('checked'): continue
                  p[name]=inp.get('value','')
              for ta in form.find_all('textarea'):
                  if ta.get('name'): p[ta['name']]=ta.get_text()
              for sel in form.find_all('select'):
                  if not sel.get('name'): continue
                  chosen=sel.find('option',selected=True) or sel.find('option')
                  p[sel['name']]=chosen.get('value','') if chosen else ''
              return p

          def postback(soup,target):
              p=controls(soup); p['__EVENTTARGET']=target; p['__EVENTARGUMENT']=''
              rr=s.post(SEARCH,data=p,headers={'Referer':SEARCH,'Origin':'https://aca-prod.accela.com'},timeout=120)
              rr.raise_for_status(); return BeautifulSoup(rr.text,'html.parser')

          r=s.get(SEARCH,timeout=90); r.raise_for_status(); soup=BeautifulSoup(r.text,'html.parser')
          p=controls(soup); p['__EVENTTARGET']='ctl00$PlaceHolderMain$btnNewSearch'; p['__EVENTARGUMENT']=''
          p['ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate']='06/01/2026'
          p['ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate']='06/21/2026'
          p['ctl00$PlaceHolderMain$generalSearchForm$txtGSStartDate_ext_ClientState']=''
          p['ctl00$PlaceHolderMain$generalSearchForm$txtGSEndDate_ext_ClientState']=''
          rr=s.post(SEARCH,data=p,headers={'Referer':SEARCH,'Origin':'https://aca-prod.accela.com'},timeout=120)
          rr.raise_for_status(); soup=BeautifulSoup(rr.text,'html.parser')

          def rows(soup):
              table=soup.find('table',id='ctl00_PlaceHolderMain_dgvPermitList_gdvPermitList'); out=[]
              if not table:return out
              for tr in table.find_all('tr'):
                  link=tr.find('a',id=re.compile(r'_hlPermitNumber$'))
                  if not link:continue
                  def v(sfx):
                      x=tr.find(id=re.compile(re.escape(sfx)+r'$')); return ' '.join(x.stripped_strings) if x else ''
                  out.append({'date':v('_lblUpdatedTime'),'number':' '.join(link.stripped_strings),'type':v('_lblType'),
                              'description':v('_lblDescription'),'project':v('_lblProjectName'),'status':v('_lblStatus'),
                              'address':v('_lblPermitAddress'),'url':urljoin(SEARCH,link.get('href',''))})
              return out

          all_rows=[]
          for page in range(1,16):
              rs=rows(soup); all_rows.extend(rs)
              print('PAGE',page,'ROWS',len(rs),'STATUSES',dict(Counter(x['status'] for x in rs)))
              nxt=next((a for a in soup.find_all('a',href=True) if ' '.join(a.stripped_strings)=='Next >'),None)
              if not nxt:break
              m=re.search(r"__doPostBack\('([^']+)'",nxt['href'])
              if not m:break
              soup=postback(soup,m.group(1))

          structural=[x for x in all_rows if 'Structural Permit' in x['type']]
          print('TOTAL',len(all_rows),'STRUCTURAL',len(structural),'STATUS',dict(Counter(x['status'] for x in structural)))
          for x in structural:print('STRUCT',x)

          # Inspect all post-review structural records plus one generic Issued record.
          samples=[x for x in structural if x['status'] in {'Issued','Inspection Phase','Closed - Complete','Active'}][:12]
          issued_any=next((x for x in all_rows if x['status']=='Issued'),None)
          if issued_any and issued_any not in samples:samples.append(issued_any)
          for item in samples:
              d=s.get(item['url'],headers={'Referer':SEARCH},timeout=90); d.raise_for_status(); ds=BeautifulSoup(d.text,'html.parser')
              print('\nDETAIL',item['number'],'TYPE',item['type'],'STATUS',item['status'],'DATECOL',item['date'])
              print('URL',item['url'],'BYTES',len(d.content))
              print('ID_FIELDS')
              for tag in ds.find_all(id=True):
                  ident=tag.get('id',''); txt=' '.join(tag.stripped_strings)
                  if re.search(r'(status|date|issue|valuation|value|licensed|professional|owner|project|address)',ident,re.I) and 0<len(txt)<700:
                      print(ident,'=>',txt[:650])
              print('USEFUL_ROWS')
              c=0
              for tr in ds.find_all('tr'):
                  txt=' '.join(tr.stripped_strings)
                  if txt and re.search(r'(Record Status|Status Date|Issued|Issue Date|Valuation|Job Value|Licensed Professional|Owner|General Project Information|Subtype|New Building Area|Area Square Footage|Project Description)',txt,re.I):
                      print(txt[:1800]); c+=1
                      if c>=45:break
          PY
