name: Hillsboro branch validation

on:
  push:
    branches: [expand-oregon-hillsboro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hillsboro-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate issued Hillsboro records in prior windows
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import date, timedelta

          from oregon_permits.classify import classify_permit
          from oregon_permits.collectors.base import new_session
          from oregon_permits.collectors.hillsboro import HillsboroCollector

          collector = HillsboroCollector()
          session = new_session()
          today = date.today()
          invalid_published = []
          total_post_issue_structural = 0
          total_new_candidates = 0
          total_validated = 0
          total_qualifying = 0

          windows = [
              ("DAYS_22_42", today - timedelta(days=42), today - timedelta(days=21)),
              ("DAYS_43_63", today - timedelta(days=63), today - timedelta(days=42)),
          ]

          for label, start, end in windows:
              rows = collector._search_window(session, start, end)
              if rows is None:
                  raise SystemExit(f"{label}: Hillsboro search window failed")
              structural = [r for r in rows if collector.structural_re.search(r.get("record_type") or "")]
              post_issue = [
                  r for r in structural
                  if (r.get("status") or "").strip().lower() in collector.issued_statuses
              ]
              total_post_issue_structural += len(post_issue)
              print("WINDOW", label, start.isoformat(), end.isoformat(),
                    "ROWS", len(rows), "STRUCTURAL", len(structural),
                    "POST_ISSUE_STRUCTURAL", len(post_issue),
                    "POST_ISSUE_STATUSES", dict(Counter(r.get("status") for r in post_issue)))

              permits = []
              detail_failures = []
              for row in post_issue:
                  try:
                      detail = collector._detail(session, row["source_url"])
                  except Exception as exc:
                      detail_failures.append((row["permit_number"], type(exc).__name__, str(exc)))
                      print("DETAIL_FAIL", label, row["permit_number"], type(exc).__name__, str(exc))
                      continue

                  subtype = detail.get("subtype") or ""
                  is_new = bool(collector.new_subtype_re.search(subtype))
                  print("POST_ISSUE_DETAIL", label, row["permit_number"],
                        "STATUS", row.get("status"), "SUBTYPE", repr(subtype), "NEW", is_new)
                  if not is_new:
                      continue

                  total_new_candidates += 1
                  issued_validated = collector._validate_issued(row["permit_number"])
                  permit = collector._permit(row, detail, issued_validated, today)
                  if permit:
                      classify_permit(permit)
                      permits.append(permit)

              validated = [p for p in permits if (p.raw or {}).get("source_issued_validated") is True]
              qualifying = [p for p in permits if p.qualifies]
              invalid = [p.permit_number for p in qualifying if (p.raw or {}).get("source_issued_validated") is not True]
              invalid_published.extend(invalid)
              total_validated += len(validated)
              total_qualifying += len(qualifying)

              print("WINDOW_RESULT", label,
                    "NEW_POST_ISSUE_CANDIDATES", len(permits),
                    "VALIDATED_ISSUED", len(validated),
                    "QUALIFYING", len(qualifying),
                    "CLASSIFICATIONS", dict(Counter(p.classification for p in qualifying)),
                    "DETAIL_FAILURES", len(detail_failures))
              for p in permits:
                  print("PERMIT", label, p.permit_number,
                        "STATUS", p.status,
                        "SUBTYPE", (p.raw or {}).get("subtype"),
                        "ISSUED_VALIDATED", (p.raw or {}).get("source_issued_validated"),
                        "QUALIFIES", p.qualifies,
                        "CLASS", p.classification)

          print("TOTAL_PRIOR_WINDOWS",
                "POST_ISSUE_STRUCTURAL", total_post_issue_structural,
                "NEW_POST_ISSUE_CANDIDATES", total_new_candidates,
                "VALIDATED_ISSUED", total_validated,
                "QUALIFYING", total_qualifying,
                "INVALID_PUBLISHED", invalid_published)
          if invalid_published:
              raise SystemExit("Hillsboro safety invariant failed: unvalidated permit qualified")
          PY
