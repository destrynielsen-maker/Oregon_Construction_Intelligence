name: Hillsboro branch validation

on:
  push:
    branches: [expand-oregon-hillsboro]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run live Hillsboro collector
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from oregon_permits.classify import classify_permit
          from oregon_permits.collectors.hillsboro import HillsboroCollector

          result = HillsboroCollector().collect()
          permits = result.permits
          for permit in permits:
              classify_permit(permit)

          statuses = Counter((p.status or "UNKNOWN") for p in permits)
          subtypes = Counter((p.raw or {}).get("subtype") or "UNKNOWN" for p in permits)
          qualifying = [p for p in permits if p.qualifies]
          classes = Counter(p.classification for p in qualifying)
          validated = [p for p in permits if (p.raw or {}).get("source_issued_validated") is True]
          invalid_published = [p.permit_number for p in qualifying if (p.raw or {}).get("source_issued_validated") is not True]

          print("SOURCE", result.source)
          print("RECORDS", len(permits))
          print("VALIDATED_ISSUED", len(validated))
          print("QUALIFYING", len(qualifying))
          print("CLASSIFICATIONS", dict(classes))
          print("STATUSES", dict(statuses))
          print("SUBTYPES", dict(subtypes))
          print("NEWEST_ISSUED", max((p.issued_date for p in qualifying if p.issued_date), default=None))
          print("INVALID_PUBLISHED", invalid_published)

          if invalid_published:
              raise SystemExit("Hillsboro safety invariant failed: unvalidated permits qualified")
          if not permits:
              raise SystemExit("Hillsboro collector returned no new-construction structural candidates")
          PY
