name: Hillsboro branch validation

on:
  push:
    branches: [expand-oregon-hillsboro]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Inspect Hillsboro structural detail subtypes
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from oregon_permits.collectors.hillsboro import HillsboroCollector
          from oregon_permits.collectors.base import new_session

          collector = HillsboroCollector()
          session = new_session()
          today = date.today()
          rows = collector._search_window(session, today - timedelta(days=21), today)
          if rows is None:
              raise SystemExit("Hillsboro search window failed")

          structural = [r for r in rows if collector.structural_re.search(r.get("record_type") or "")]
          print("ROWS", len(rows), "STRUCTURAL", len(structural))
          new_count = 0
          failures = []
          for row in structural:
              try:
                  detail = collector._detail(session, row["source_url"])
              except Exception as exc:
                  failures.append((row["permit_number"], type(exc).__name__, str(exc)))
                  print("DETAIL_FAIL", row["permit_number"], type(exc).__name__, str(exc))
                  continue
              subtype = detail.get("subtype")
              is_new = bool(subtype and collector.new_subtype_re.search(subtype))
              new_count += int(is_new)
              print("DETAIL", row["permit_number"], "STATUS", row.get("status"), "SUBTYPE", repr(subtype), "NEW", is_new)

          print("NEW_SUBTYPE_COUNT", new_count)
          print("DETAIL_FAILURES", failures)
          if structural and len(failures) == len(structural):
              raise SystemExit("All Hillsboro structural detail requests failed")
          PY
