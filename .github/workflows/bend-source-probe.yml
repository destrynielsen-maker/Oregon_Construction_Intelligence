name: Bend expansion validation

on:
  push:
    branches: [expand-oregon-bend]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run Bend collector
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from oregon_permits.classify import classify_permit
          from oregon_permits.collectors.bend import BendCollector
          result=BendCollector().collect()
          for permit in result.permits:
              classify_permit(permit)
          qualifying=[p for p in result.permits if p.qualifies]
          print('COLLECTED', len(result.permits))
          print('QUALIFYING', len(qualifying))
          print('CLASSES', dict(Counter(p.classification for p in qualifying)))
          print('NEWEST', max(p.issued_date for p in result.permits))
          print('OLDEST', min(p.issued_date for p in result.permits))
          print('GC_KNOWN', sum(1 for p in qualifying if p.contractor))
          if not qualifying:
              raise SystemExit('Bend collector produced zero qualifying leads')
          PY
      - name: Run full Oregon pipeline
        env:
          PYTHONPATH: src
          SITE_BASE_URL: https://destrynielsen-maker.github.io/Oregon_Construction_Intelligence/
        run: |
          python -m oregon_permits.main
          python - <<'PY'
          import json
          from collections import Counter
          payload=json.load(open('public/data/sources.json',encoding='utf-8'))
          sources={x['source']:x for x in payload['sources']}
          if set(sources) != {'Portland','Eugene','Bend'}:
              raise SystemExit(f'unexpected sources: {sorted(sources)}')
          if any(x['status'] != 'healthy' for x in sources.values()):
              raise SystemExit(f'unhealthy source: {sources}')
          permits=json.load(open('public/data/permits.json',encoding='utf-8'))['permits']
          bend=[p for p in permits if p.get('jurisdiction')=='Bend']
          print('SOURCE_STATUS', json.dumps(list(sources.values()), sort_keys=True))
          print('BEND_PUBLISHED', len(bend))
          print('BEND_CLASSES', dict(Counter(p.get('classification') for p in bend)))
          if not bend:
              raise SystemExit('pipeline published zero Bend leads')
          PY
