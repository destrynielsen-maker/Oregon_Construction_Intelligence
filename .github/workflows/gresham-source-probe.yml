name: Gresham source probe

on:
  push:
    branches: [expand-oregon-gresham]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gresham-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Probe anonymous Gresham EnerGov search
        run: |
          python - <<'PY'
          import copy
          import json
          import requests

          base = "https://greshamor-energovweb.tylerhost.net/apps/SelfService/"
          criteria_url = base + "api/energov/search/criteria"
          search_url = base + "api/energov/search/search"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)",
              "Referer": base,
          })

          home = session.get(base, timeout=60)
          print("HOME", home.status_code, home.url)
          home.raise_for_status()

          criteria = session.get(criteria_url, headers={"Accept": "application/json, text/plain, */*"}, timeout=60)
          print("CRITERIA", criteria.status_code, criteria.headers.get("content-type"))
          criteria.raise_for_status()
          payload = criteria.json()["Result"]
          print("TOP_LEVEL_KEYS", sorted(payload.keys()))
          print("PERMIT_KEYS", sorted((payload.get("PermitCriteria") or {}).keys()))

          body = copy.deepcopy(payload)
          body["SearchModule"] = 1
          body["FilterModule"] = 1
          body["PageNumber"] = 1
          body["PageSize"] = 10
          body["Keyword"] = ""
          body["ExactMatch"] = False
          permit = body.setdefault("PermitCriteria", {})
          permit["IssueDateFrom"] = "08/01/2026"
          permit["IssueDateTo"] = "08/25/2026"

          attempts = [
              ("session_only", {}),
              ("tenant_guess", {
                  "tenantId": "1",
                  "tenantName": "GreshamOrProd",
                  "Tyler-TenantUrl": "GreshamOrProd",
                  "Tyler-Tenant-Culture": "en-US",
              }),
          ]

          success = False
          for label, extra in attempts:
              headers = {"Accept": "application/json, text/plain, */*", "Content-Type": "application/json;charset=UTF-8", **extra}
              r = session.post(search_url, headers=headers, data=json.dumps(body), timeout=90)
              print("POST", label, "STATUS", r.status_code, "CTYPE", r.headers.get("content-type"), "LEN", len(r.text))
              print("POST_BODY_PREFIX", label, " ".join(r.text[:1200].split()))
              if r.status_code != 200:
                  continue
              try:
                  data = r.json()
              except ValueError:
                  continue
              result = data.get("Result", data)
              if isinstance(result, dict):
                  print("RESULT_KEYS", sorted(result.keys()))
                  for key, value in result.items():
                      if isinstance(value, list):
                          print("LIST_FIELD", key, "COUNT", len(value))
                          if value:
                              first = value[0]
                              print("FIRST_RECORD_KEYS", key, sorted(first.keys()) if isinstance(first, dict) else type(first).__name__)
                              print("FIRST_RECORD", key, json.dumps(first, default=str)[:3000])
                  success = True
              break

          if not success:
              raise SystemExit("Gresham EnerGov anonymous search POST did not return a usable JSON result")
          PY
