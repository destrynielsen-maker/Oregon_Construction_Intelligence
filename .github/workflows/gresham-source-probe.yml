name: Gresham source probe

on:
  push:
    branches: [expand-oregon-gresham]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gresham-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Map Gresham EnerGov anonymous module filters
        run: |
          python - <<'PY'
          import copy
          import requests

          base = "https://greshamor-energovweb.tylerhost.net/apps/SelfService/"
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)",
              "Referer": base,
          })
          tenant = {
              "tenantId": "1",
              "tenantName": "GreshamOrProd",
              "Tyler-TenantUrl": "GreshamOrProd",
              "Tyler-Tenant-Culture": "en-US",
              "Accept": "application/json, text/plain, */*",
              "Content-Type": "application/json;charset=UTF-8",
          }

          session.get(base, timeout=60).raise_for_status()
          c = session.get(base + "api/energov/search/criteria", headers=tenant, timeout=60)
          c.raise_for_status()
          template = c.json()["Result"]
          url = base + "api/energov/search/search"

          for module in range(0, 12):
              body = copy.deepcopy(template)
              body["SearchModule"] = 1
              body["FilterModule"] = module
              body["PageNumber"] = 1
              body["PageSize"] = 3
              body["Keyword"] = ""
              body["ExactMatch"] = False
              r = session.post(url, headers=tenant, json=body, timeout=90)
              if r.status_code != 200:
                  print("MODULE", module, "STATUS", r.status_code, "BODY", " ".join(r.text[:300].split()))
                  continue
              result = r.json().get("Result", {})
              print(
                  "MODULE", module,
                  "TOTAL", result.get("TotalFound"),
                  "PERMITS", result.get("PermitsFound"),
                  "PLANS", result.get("PlansFound"),
                  "BUSINESS", result.get("BusinessLicensesFound"),
                  "CODE", result.get("CodeCasesFound"),
                  "INSPECTIONS", result.get("InspectionsFound"),
              )
              for item in (result.get("EntityResults") or [])[:3]:
                  print(
                      "ITEM", module,
                      "MODULE_NAME", item.get("ModuleName"),
                      "NUMBER", item.get("CaseNumber"),
                      "TYPE", item.get("CaseType"),
                      "WORKCLASS", item.get("CaseWorkclass"),
                      "STATUS", item.get("CaseStatus"),
                      "ISSUE", item.get("IssueDate"),
                  )
          PY
