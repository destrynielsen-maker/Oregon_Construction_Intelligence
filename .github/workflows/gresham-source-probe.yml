name: Gresham branch validation

on:
  push:
    branches: [expand-oregon-gresham]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gresham-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate live production Gresham collector
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import date, timedelta

          from oregon_permits.classify import classify_permit
          from oregon_permits.collectors.gresham import GreshamCollector

          collector = GreshamCollector()
          result = collector.collect()
          permits = result.permits
          today = date.today()
          cutoff = today - timedelta(days=collector.lookback_days)

          for permit in permits:
              classify_permit(permit)

          print("SOURCE", result.source)
          print("LOOKBACK_DAYS", collector.lookback_days)
          print("CANDIDATES", len(permits))
          print("CLASSIFICATIONS", dict(Counter(p.classification for p in permits)))
          print("TYPES", dict(Counter((p.raw or {}).get("type_of_use") for p in permits)))
          print("NEWEST", max((p.issued_date for p in permits), default=None))
          print("OLDEST", min((p.issued_date for p in permits), default=None))
          print("NOTE", result.note)

          invalid=[]
          for p in permits:
              issued = date.fromisoformat(p.issued_date)
              if not p.qualifies:
                  invalid.append((p.permit_number, "not_qualifying", p.classification))
              if issued > today:
                  invalid.append((p.permit_number, "future_issue_date", p.issued_date))
              if issued < cutoff:
                  invalid.append((p.permit_number, "older_than_cutoff", p.issued_date))
              raw = p.raw or {}
              if raw.get("work_proposed") != "New Construction":
                  invalid.append((p.permit_number, "wrong_workclass", raw.get("work_proposed")))
              if str(raw.get("type_of_use") or "").lower() not in collector.new_types:
                  invalid.append((p.permit_number, "wrong_type", raw.get("type_of_use")))

          print("INVALID", invalid)
          for p in sorted(permits, key=lambda x: x.issued_date, reverse=True)[:20]:
              print("PERMIT", p.permit_number, p.issued_date, p.classification, repr(p.project_name), repr(p.address))

          if not permits:
              raise SystemExit("Gresham production collector returned zero new-construction permits")
          if invalid:
              raise SystemExit(f"Gresham production invariants failed: {invalid}")
          PY
