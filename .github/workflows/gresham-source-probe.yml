name: Gresham source probe

on:
  push:
    branches: [expand-oregon-gresham]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gresham-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Probe anonymous Gresham EnerGov endpoints
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          base = "https://greshamor-energovweb.tylerhost.net/apps/SelfService/"
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)",
              "Accept": "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",
          })

          home = session.get(base, timeout=60)
          print("HOME", home.status_code, home.url, "LEN", len(home.text))
          home.raise_for_status()
          soup = BeautifulSoup(home.text, "html.parser")
          scripts = [urljoin(home.url, s.get("src")) for s in soup.find_all("script", src=True)]
          print("SCRIPTS", len(scripts))
          for src in scripts[:20]:
              print("SCRIPT", src)

          # Tyler EnerGov Self Service commonly exposes anonymous search through this controller.
          paths = [
              "api/energov/search/criteria",
              "api/energov/search/search",
              "/api/energov/search/criteria",
              "/api/energov/search/search",
          ]
          for path in paths:
              url = urljoin(base, path)
              try:
                  r = session.get(url, headers={"Referer": home.url, "Accept": "application/json, text/plain, */*"}, timeout=60)
                  preview = re.sub(r"\s+", " ", r.text[:800])
                  print("GET", url, "STATUS", r.status_code, "CTYPE", r.headers.get("content-type"), "LEN", len(r.text), "BODY", preview)
              except Exception as exc:
                  print("GET_FAIL", url, type(exc).__name__, str(exc))

          # Scan local JS bundles for public tenant/search configuration without dumping full bundles.
          needles = ["tenantName", "tenantId", "Tyler-TenantUrl", "api/energov/search/criteria", "api/energov/search/search"]
          hits = 0
          for src in scripts[:20]:
              if not src.lower().endswith((".js", ".js?v=")) and ".js" not in src.lower():
                  continue
              try:
                  r = session.get(src, timeout=60)
                  if r.status_code != 200 or len(r.text) > 12_000_000:
                      continue
                  text = r.text
                  for needle in needles:
                      pos = text.find(needle)
                      if pos >= 0:
                          hits += 1
                          snippet = re.sub(r"\s+", " ", text[max(0,pos-180):pos+300])
                          print("JS_HIT", needle, src, snippet)
              except Exception as exc:
                  print("SCRIPT_FAIL", src, type(exc).__name__, str(exc))
          print("JS_HITS", hits)
          PY
