name: Oregon Beaverton full validation

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oregon-beaverton-full-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run six-source Oregon pipeline
        env:
          PYTHONPATH: src
        run: |
          python -m oregon_permits.main
          python - <<'PY'
          import json
          from pathlib import Path

          sources=json.loads(Path('public/data/sources.json').read_text())['sources']
          permits=json.loads(Path('public/data/permits.json').read_text())['permits']
          expected=['Portland','Eugene','Bend','Hillsboro','Gresham','Beaverton']
          names=[x['source'] for x in sources]
          print('SOURCES',names)
          for x in sources:
              print('SOURCE',x['source'],x['technical_status'],x['records_seen'],x['qualifying_records'],x['newest_permit_date'])
          print('TOTAL_QUALIFYING',len(permits))
          print('BEAVERTON_STORED',sum(1 for x in permits if x['jurisdiction']=='Beaverton'))
          print('JURISDICTIONS',sorted({x['jurisdiction'] for x in permits}))

          if names != expected:
              raise SystemExit(f'registry mismatch: {names}')
          if any(x['technical_status']!='ok' for x in sources):
              raise SystemExit('collector technical failure')
          b=next(x for x in sources if x['source']=='Beaverton')
          if b['qualifying_records'] <= 0:
              raise SystemExit('no qualifying Beaverton records')
          if not any(x['jurisdiction']=='Beaverton' and x['qualifies'] for x in permits):
              raise SystemExit('Beaverton missing from qualifying output')
          for feed in ['new-construction.xml','multifamily.xml','single-family.xml','commercial.xml','top-opportunities.xml']:
              if not (Path('public/feeds')/feed).exists():
                  raise SystemExit('missing feed '+feed)
          PY
