name: Beaverton source probe

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Test native Beaverton CIVICS query filters
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import requests

          base='https://prod.buildinginbeaverton.org/'
          api=urljoin(base,'delegate/civics-api/api/')
          lookup=urljoin(base,'lookup-record')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)'})
          s.get(lookup,timeout=20).raise_for_status()
          a=s.get(urljoin(api,'anonymous/auth'),headers={'Referer':lookup,'Accept':'application/json'},timeout=20)
          print('AUTH',a.status_code); a.raise_for_status()
          headers={'Referer':lookup,'Accept':'application/json, text/plain, */*'}
          base_params={'Page':'[{Max:10,Start:1}]','OrderBy':'[{Property:IssuedDateTime,Direction:Desc}]'}

          attempts=[
              ('ApplicationTypeId',{'ApplicationTypeId':'1013'}),
              ('ApplicationTypeCode',{'ApplicationTypeCode':'R'}),
              ('ApplicationType',{'ApplicationType':'R'}),
              ('WorkType',{'WorkType':'HouseOrAdu'}),
              ('Fields',{'Fields':'id,applicationNumber,applicationName,issuedDateTime,status,statusDescription,processState,workType,workTypeDescription,occupancyType,occupancyTypeDescription,declaredValuation,squareFootage,comments,locationLine1,locationLine2,applicationType'}),
          ]
          for label,extra in attempts:
              params=dict(base_params); params.update(extra)
              try:
                  r=s.get(urljoin(api,'cdr/applications/building'),params=params,headers=headers,timeout=25)
                  print('TRY',label,'STATUS',r.status_code,'LEN',len(r.text))
                  if r.status_code!=200:
                      print('BODY',label,' '.join(r.text[:800].split())); continue
                  rows=r.json().get('data') or []
                  codes=[]; works=[]
                  for x in rows:
                      at=x.get('applicationType') if isinstance(x,dict) else None
                      codes.append(at.get('code') if isinstance(at,dict) else None)
                      works.append(x.get('workType') if isinstance(x,dict) else None)
                  print('CODES',label,codes)
                  print('WORKS',label,works)
                  if rows:
                      print('ROW_KEYS',label,sorted(rows[0].keys()))
              except Exception as exc:
                  print('FAIL',label,type(exc).__name__,str(exc))
          PY
