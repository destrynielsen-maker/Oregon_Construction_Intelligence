name: Beaverton branch validation

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beaverton-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate live production Beaverton collector
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from collections import Counter
          from datetime import date, timedelta

          from oregon_permits.classify import classify_permit
          from oregon_permits.collectors.beaverton import BeavertonCollector

          collector=BeavertonCollector()
          result=collector.collect()
          today=date.today()
          cutoff=today-timedelta(days=collector.lookback_days)
          permits=result.permits
          invalid=[]
          for p in permits:
              classify_permit(p)
              issued=date.fromisoformat(p.issued_date)
              raw=p.raw or {}
              if not p.qualifies:
                  invalid.append((p.permit_number,'not_qualifying',p.classification))
              if issued>today or issued<cutoff:
                  invalid.append((p.permit_number,'date',p.issued_date))
              if raw.get('application_type_code') not in {'C','MF','R'}:
                  invalid.append((p.permit_number,'type',raw.get('application_type_code')))
              if raw.get('work_type_code') not in {'HouseOrAdu','NewCon'}:
                  invalid.append((p.permit_number,'work',raw.get('work_type_code')))

          print('SOURCE',result.source)
          print('LOOKBACK_DAYS',collector.lookback_days)
          print('CANDIDATES',len(permits))
          print('CLASSIFICATIONS',dict(Counter(p.classification for p in permits)))
          print('TYPES',dict(Counter((p.raw or {}).get('application_type_code') for p in permits)))
          print('WORK_TYPES',dict(Counter((p.raw or {}).get('work_type_code') for p in permits)))
          print('NEWEST',max((p.issued_date for p in permits),default=None))
          print('OLDEST',min((p.issued_date for p in permits),default=None))
          print('WITH_CONTRACTOR',sum(1 for p in permits if p.contractor))
          print('INVALID',invalid)
          print('NOTE',result.note)
          for p in sorted(permits,key=lambda x:x.issued_date,reverse=True)[:25]:
              print('PERMIT',p.permit_number,p.issued_date,p.classification,repr(p.contractor),repr(p.project_name),repr(p.address))

          if not permits:
              raise SystemExit('Beaverton production collector returned zero issued new-construction permits')
          if invalid:
              raise SystemExit(f'Beaverton production invariants failed: {invalid}')
          PY
