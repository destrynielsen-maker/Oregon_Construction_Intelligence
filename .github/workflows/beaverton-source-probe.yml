name: Beaverton source probe

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Trace Beaverton public building detail API
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          base='https://prod.buildinginbeaverton.org/'
          api=urljoin(base,'delegate/civics-api/api/')
          lookup=urljoin(base,'lookup-record')
          details=urljoin(base,'record-details/')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)'})
          s.get(lookup,timeout=20).raise_for_status()
          auth=s.get(urljoin(api,'anonymous/auth'),headers={'Referer':lookup,'Accept':'application/json'},timeout=20)
          print('AUTH',auth.status_code,' '.join(auth.text[:250].split())); auth.raise_for_status()
          headers={'Referer':details,'Accept':'application/json, text/plain, */*'}

          page=s.get(details,timeout=30)
          print('DETAIL_PAGE',page.status_code,page.url,'LEN',len(page.text)); page.raise_for_status()
          soup=BeautifulSoup(page.text,'html.parser')
          scripts=[urljoin(page.url,x.get('src')) for x in soup.find_all('script',src=True)]
          print('SCRIPT_COUNT',len(scripts))
          for u in scripts:
              if any(k in u.lower() for k in ('instrument','detail','building','cdr','record')):
                  print('SCRIPT',u)

          needles=[
              'BuildingApplication', 'buildingapplication', 'buildingapplications',
              'intdetails', 'instrumentDetail', 'instrument-details',
              'IssueDate', 'issuedDate', 'Permit Issued', 'Work Type',
              'Declared Valuation', 'Square Footage', 'Occupancy Type',
              'urlRoot', 'cdr/building', 'cdr/applications', 'core/instruments'
          ]
          seen=set()
          routes=set()
          for u in scripts:
              try:
                  r=s.get(u,timeout=45)
                  if r.status_code!=200 or len(r.text)>18_000_000:
                      continue
                  text=r.text
                  low=text.lower()
                  if not any(n.lower() in low for n in needles):
                      continue
                  print('BUNDLE',u,'LEN',len(text))
                  for m in re.finditer(r'["\']([^"\']{1,300})["\']',text):
                      v=m.group(1)
                      lv=v.lower()
                      if any(k in lv for k in ('buildingapplication','building/application','cdr/building','instrument/detail','instrumentdetail','core/instrument')):
                          routes.add(v)
                  for needle in needles:
                      start=0
                      hits=0
                      while hits<5:
                          p=low.find(needle.lower(),start)
                          if p<0: break
                          key=(u,needle,p)
                          if key not in seen:
                              seen.add(key)
                              snippet=re.sub(r'\s+',' ',text[max(0,p-650):p+1500])
                              print('CTX',needle,snippet)
                          start=p+len(needle)
                          hits+=1
              except Exception as e:
                  print('SCRIPT_FAIL',u,type(e).__name__,str(e))

          print('ROUTES',len(routes))
          for v in sorted(routes):
              print('ROUTE',v)

          # Known public controls from the list API. Do not assume which identifier the detail API uses.
          controls=[
              ('issued','C2026-04216',27087,34998),
              ('pending_new','R2026-04233',27104,35017),
          ]
          candidates=[]
          for label,number,row_id,common_id in controls:
              for ident in (row_id,common_id,number):
                  for template in (
                      'cdr/buildingapplications/{id}',
                      'cdr/buildingapplication/{id}',
                      'cdr/building/applications/{id}',
                      'cdr/applications/building/{id}',
                      'core/instruments/{id}',
                      'core/views/instruments/{id}',
                  ):
                      candidates.append((label,number,template.format(id=ident)))
          for label,number,path in candidates:
              try:
                  r=s.get(urljoin(api,path),headers=headers,timeout=12)
                  if r.status_code not in (404,405):
                      print('TRY',label,number,path,'STATUS',r.status_code,'CTYPE',r.headers.get('content-type'),'LEN',len(r.text),'BODY',' '.join(r.text[:4500].split()))
              except Exception as e:
                  print('TRY_FAIL',label,number,path,type(e).__name__,str(e))
          PY
