name: Beaverton source probe

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect Beaverton building detail fields
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import json
          import requests

          base='https://prod.buildinginbeaverton.org/'
          api=urljoin(base,'delegate/civics-api/api/')
          lookup=urljoin(base,'lookup-record')
          details=urljoin(base,'record-details/')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)'})
          s.get(lookup,timeout=20).raise_for_status()
          auth=s.get(urljoin(api,'anonymous/auth'),headers={'Referer':lookup,'Accept':'application/json'},timeout=20)
          print('AUTH',auth.status_code,' '.join(auth.text[:250].split())); auth.raise_for_status()
          headers={'Referer':details,'Accept':'application/json, text/plain, */*'}

          controls=[
              ('issued_nonnew','C2026-04216',27087),
              ('pending_new','R2026-04233',27104),
          ]

          keywords=(
              'issued','approved','applicationdate','worktype','occupancy','valuation','square',
              'status','processstate','milestone','applicationname','comments','description',
              'contractor','applicant','owner','contact','provider','address','location','parcel','site'
          )
          sensitive=('email','phone','mobile','fax','password','taxid','ssn')

          def walk(value,path='data',depth=0):
              if depth>6:
                  return
              if isinstance(value,dict):
                  for k,v in value.items():
                      p=f'{path}.{k}'
                      lk=k.lower()
                      if any(x in lk for x in sensitive):
                          continue
                      if any(x in lk for x in keywords):
                          if isinstance(v,(str,int,float,bool)) or v is None:
                              text=repr(v)
                              if len(text)>700: text=text[:700]+'...'
                              print('FIELD',p,text)
                          elif isinstance(v,list):
                              print('FIELD',p,'LIST_COUNT',len(v))
                          elif isinstance(v,dict):
                              print('FIELD',p,'DICT_KEYS',sorted(v.keys())[:80])
                      walk(v,p,depth+1)
              elif isinstance(value,list):
                  for i,v in enumerate(value[:12]):
                      walk(v,f'{path}[{i}]',depth+1)

          for label,number,internal_id in controls:
              r=s.get(urljoin(api,f'cdr/applications/building/{internal_id}'),headers=headers,timeout=30)
              print('DETAIL',label,number,r.status_code,'LEN',len(r.text)); r.raise_for_status()
              payload=r.json()
              data=payload.get('data') or {}
              print('TOP_KEYS',label,sorted(data.keys()))
              for key in [
                  'applicationNumber','commonId','applicationName','applicationDateTime','issuedDateTime',
                  'ApprovedDateTime','approvedDateTime','finalizedDateTime','processState','status','statusDescription',
                  'workType','occupancyType','declaredValuation','calculatedValuation','squareFootage','comments',
                  'locationLine1','locationLine2','locationLine3','apTypeCode','applicationType'
              ]:
                  if key in data:
                      value=data.get(key)
                      if isinstance(value,(dict,list)):
                          print('KEY',label,key,json.dumps(value,default=str)[:2500])
                      else:
                          print('KEY',label,key,repr(value))
              walk(data)

              # Public child resources used by the detail UI. Keep identity output to names/roles only.
              for child in ['applicants','contacts','providers']:
                  path=f'cdr/applications/building/{internal_id}/{child}?Page=[{{Max:20}}]'
                  try:
                      cr=s.get(urljoin(api,path),headers=headers,timeout=15)
                      if cr.status_code==200:
                          cp=cr.json(); rows=cp.get('data') or []
                          print('CHILD',label,child,'COUNT',len(rows) if isinstance(rows,list) else type(rows).__name__)
                          if isinstance(rows,list):
                              for item in rows[:10]:
                                  if not isinstance(item,dict): continue
                                  safe={}
                                  for k,v in item.items():
                                      lk=k.lower()
                                      if any(x in lk for x in sensitive): continue
                                      if any(x in lk for x in ('name','type','role','company','business','primary','license')) and isinstance(v,(str,int,float,bool,type(None))):
                                          safe[k]=v
                                      elif k.lower() in ('contact','identity','provider') and isinstance(v,dict):
                                          safe[k]={kk:vv for kk,vv in v.items() if any(x in kk.lower() for x in ('name','company','business','type')) and isinstance(vv,(str,int,float,bool,type(None)))}
                                  print('CHILD_ROW',label,child,json.dumps(safe,default=str)[:1800])
                      elif cr.status_code not in (404,405):
                          print('CHILD_STATUS',label,child,cr.status_code,' '.join(cr.text[:500].split()))
                  except Exception as exc:
                      print('CHILD_FAIL',label,child,type(exc).__name__,str(exc))
          PY
