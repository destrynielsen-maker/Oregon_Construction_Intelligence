name: Beaverton source probe

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Test Beaverton issued building resource
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import json
          import requests

          base='https://prod.buildinginbeaverton.org/'
          api=urljoin(base,'delegate/civics-api/api/')
          lookup=urljoin(base,'lookup-record')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)'})
          s.get(lookup,timeout=20).raise_for_status()
          auth=s.get(urljoin(api,'anonymous/auth'),headers={'Referer':lookup,'Accept':'application/json'},timeout=20)
          print('AUTH',auth.status_code,' '.join(auth.text[:250].split())); auth.raise_for_status()
          headers={'Referer':lookup,'Accept':'application/json, text/plain, */*'}

          attempts=[
              {'Page':'[{Max:10,Start:1}]','OrderBy':'[{Property:IssuedDateTime,Direction:Desc}]'},
              {'Page':'[{max:10,start:1}]','OrderBy':'[{property:IssuedDateTime,direction:Desc}]'},
              {'Page':'[{Max:10}]','OrderBy':'[{Property:IssuedDateTime,Direction:Desc}]'},
              {'Page':'[{max:10}]','OrderBy':'[{property:IssuedDateTime,direction:Desc}]'},
          ]
          success=None
          for params in attempts:
              try:
                  r=s.get(urljoin(api,'cdr/applications/building'),params=params,headers=headers,timeout=30)
                  print('TRY',params,'STATUS',r.status_code,'CTYPE',r.headers.get('content-type'),'LEN',len(r.text),'BODY',' '.join(r.text[:2200].split()))
                  if r.status_code==200:
                      success=(params,r.json())
                      break
              except Exception as exc:
                  print('TRY_FAIL',params,type(exc).__name__,str(exc))

          if not success:
              raise SystemExit('No working cdr/applications/building paging/sort serialization')

          params,payload=success
          data=payload.get('data') if isinstance(payload,dict) else None
          print('SUCCESS_PARAMS',params)
          print('PAYLOAD_KEYS',sorted(payload.keys()) if isinstance(payload,dict) else type(payload).__name__)
          if isinstance(data,dict):
              print('DATA_KEYS',sorted(data.keys()))
              rows=next((v for v in data.values() if isinstance(v,list)),[])
          elif isinstance(data,list):
              rows=data
          else:
              rows=[]
          print('ROWS',len(rows))
          for x in rows[:10]:
              if not isinstance(x,dict):
                  print('ROW_RAW',repr(x)[:800]); continue
              safe={k:x.get(k) for k in [
                  'id','applicationNumber','commonId','applicationName','applicationDateTime','issuedDateTime',
                  'status','statusDescription','processState','workType','workTypeDescription','occupancyType',
                  'occupancyTypeDescription','declaredValuation','squareFootage','comments','locationLine1','locationLine2'
              ] if k in x}
              at=x.get('applicationType')
              if isinstance(at,dict): safe['applicationType']={k:at.get(k) for k in ('code','description','id') if k in at}
              print('ROW',json.dumps(safe,default=str)[:5000])

          # Verify that the known issued control can also be selected directly by internal id.
          control=s.get(urljoin(api,'cdr/applications/building/27087'),headers=headers,timeout=20)
          control.raise_for_status()
          c=control.json().get('data') or {}
          print('CONTROL',c.get('applicationNumber'),c.get('issuedDateTime'),c.get('workType'),c.get('statusDescription'))
          PY
