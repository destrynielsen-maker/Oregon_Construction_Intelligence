name: Beaverton source probe

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Map Beaverton CIVICS public API routes
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          base='https://prod.buildinginbeaverton.org/'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)'})
          page=s.get(urljoin(base,'lookup-record'),timeout=60)
          print('LOOKUP',page.status_code,page.url,'LEN',len(page.text))
          page.raise_for_status()
          soup=BeautifulSoup(page.text,'html.parser')
          scripts=[urljoin(page.url,x.get('src')) for x in soup.find_all('script',src=True)]
          routes=set()
          interesting=[]
          for u in scripts:
              try:
                  r=s.get(u,timeout=60)
                  if r.status_code!=200 or len(r.text)>18000000:
                      continue
                  text=r.text
                  for m in re.finditer(r'["\']([^"\']*(?:/delegate/civics-api/api/|civics-api/api/)[^"\']*)["\']',text):
                      value=m.group(1)
                      if len(value)<500:
                          routes.add(value)
                  for needle in ['InstrumentListView','instrument-list','instrumentList','instruments','queryParameters','filterOptions','publicSearch','searchCriteria']:
                      p=text.find(needle)
                      if p>=0:
                          interesting.append((needle,u,re.sub(r'\s+',' ',text[max(0,p-300):p+900])))
              except Exception as e:
                  print('SCRIPT_FAIL',u,type(e).__name__,str(e))
          print('ROUTES',len(routes))
          for x in sorted(routes):
              print('ROUTE',x)
          for needle,u,snippet in interesting[:30]:
              print('CONTEXT',needle,u,snippet)

          auth=s.get(urljoin(base,'delegate/civics-api/api/anonymous/auth'),headers={'Referer':page.url,'Accept':'application/json, text/plain, */*'},timeout=60)
          print('AUTH',auth.status_code,auth.headers.get('content-type'),'LEN',len(auth.text),'BODY',' '.join(auth.text[:1200].split()))
          print('COOKIES',[(c.name,c.domain,c.path) for c in s.cookies])
          PY
