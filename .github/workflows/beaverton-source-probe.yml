name: Beaverton source probe

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Trace Beaverton CIVICS instrument search API
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          base='https://prod.buildinginbeaverton.org/'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)'})
          page=s.get(urljoin(base,'lookup-record'),timeout=60)
          page.raise_for_status()
          soup=BeautifulSoup(page.text,'html.parser')
          scripts=[urljoin(page.url,x.get('src')) for x in soup.find_all('script',src=True)]
          target=next((u for u in scripts if 'InstrumentListView-portlet' in u),None)
          print('TARGET',target)
          if not target:
              raise SystemExit('InstrumentListView bundle not found')
          js=s.get(target,timeout=90)
          print('BUNDLE',js.status_code,'LEN',len(js.text))
          js.raise_for_status()
          text=js.text

          quoted=set()
          for m in re.finditer(r'["\']([^"\']{1,300})["\']',text):
              v=m.group(1)
              low=v.lower()
              if any(k in low for k in ('instrument','cdr/','/api/','search','filter')):
                  quoted.add(v)
          for v in sorted(quoted):
              if len(v)<220:
                  print('STRING',v)

          for needle in [
              'extendedFilter', 'InstrumentSubType', 'instrumentTypeID', 'fetchMore',
              'Backbone.Collection.extend', 'collection.url', 'urlRoot', 'cdr/instrument',
              'instrument/search', 'search/instrument', 'getSearchResults'
          ]:
              start=0
              hits=0
              while hits<8:
                  p=text.find(needle,start)
                  if p<0: break
                  snippet=re.sub(r'\s+',' ',text[max(0,p-650):p+1400])
                  print('CTX',needle,snippet)
                  start=p+len(needle)
                  hits+=1

          auth=s.get(urljoin(base,'delegate/civics-api/api/anonymous/auth'),headers={'Referer':page.url,'Accept':'application/json, text/plain, */*'},timeout=60)
          print('AUTH',auth.status_code,' '.join(auth.text[:300].split()))
          auth.raise_for_status()

          for path in [
              'delegate/civics-api/api/portal/configuration',
              'delegate/civics-api/api/portlet/configuration?portletName=rhythmcivicsInstrumentListViewportlet',
              'delegate/civics-api/api/core/codedescriptions/'
          ]:
              r=s.get(urljoin(base,path),headers={'Referer':page.url,'Accept':'application/json, text/plain, */*'},timeout=60)
              print('GET',path,r.status_code,r.headers.get('content-type'),'LEN',len(r.text),'BODY',' '.join(r.text[:1200].split()))
          PY
