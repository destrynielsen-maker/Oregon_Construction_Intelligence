name: Beaverton source probe

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe bounded Beaverton CIVICS Building search
        run: |
          python - <<'PY'
          from urllib.parse import urljoin, quote
          import requests

          base='https://prod.buildinginbeaverton.org/'
          api=urljoin(base,'delegate/civics-api/api/')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)'})
          lookup=urljoin(base,'lookup-record')
          s.get(lookup,timeout=20).raise_for_status()
          auth=s.get(urljoin(api,'anonymous/auth'),headers={'Referer':lookup,'Accept':'application/json, text/plain, */*'},timeout=20)
          print('AUTH',auth.status_code,' '.join(auth.text[:250].split()))
          auth.raise_for_status()
          headers={'Referer':lookup,'Accept':'application/json, text/plain, */*'}

          for name in [
              'rhythmcivicsInstrumentListViewportlet',
              'rhythmcivicsInstrumentListViewportlet_WAR_rhythmcivicsInstrumentListViewportlet',
          ]:
              path='portlet/configuration?portletName='+quote(name,safe='')
              try:
                  r=s.get(urljoin(api,path),headers=headers,timeout=20)
                  print('CONFIG',name,r.status_code,'LEN',len(r.text),'BODY',' '.join(r.text[:5000].split()))
              except Exception as e:
                  print('CONFIG_FAIL',name,type(e).__name__,str(e))

          for path in ['cdr/applicationtypes/Building','cdr/applicationtypes/building']:
              try:
                  r=s.get(urljoin(api,path),headers=headers,timeout=20)
                  print('TYPES',path,r.status_code,'LEN',len(r.text),'BODY',' '.join(r.text[:7000].split()))
              except Exception as e:
                  print('TYPES_FAIL',path,type(e).__name__,str(e))

          filters=[
              'Page=1,10&OrderBy=InstrumentDateTime%20desc&FilterString=%5B%7Bproperty%3AInstrumentType%2Cvalue%3ABuilding%2Coperator%3AEqual%7D%5D',
              'Page=1,10&OrderBy=InstrumentDateTime%20desc&ExtendedFilter=%5B%7Boperator%3AEqual%2Cproperty%3AInstrumentType%2Cvalue%3ABuilding%7D%5D',
              'Page=1,10&FilterString=%5B%7Bproperty%3AInstrumentType%2Cvalue%3ABuilding%7D%5D',
              'Page=1,10&Filter=Building',
          ]
          for qs in filters:
              path='core/views/instruments?'+qs
              try:
                  r=s.get(urljoin(api,path),headers=headers,timeout=20)
                  print('SEARCH',qs,'STATUS',r.status_code,'CTYPE',r.headers.get('content-type'),'LEN',len(r.text),'BODY',' '.join(r.text[:9000].split()))
              except Exception as e:
                  print('SEARCH_FAIL',qs,type(e).__name__,str(e))
          PY
