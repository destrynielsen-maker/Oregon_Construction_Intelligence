name: Beaverton source probe

on:
  push:
    branches: [expand-oregon-beaverton]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Query Beaverton public building records
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import json
          import requests

          base='https://prod.buildinginbeaverton.org/'
          api=urljoin(base,'delegate/civics-api/api/')
          lookup=urljoin(base,'lookup-record')
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; OregonConstructionIntelligence/0.1; public-permit-research)'})
          s.get(lookup,timeout=20).raise_for_status()
          auth=s.get(urljoin(api,'anonymous/auth'),headers={'Referer':lookup,'Accept':'application/json'},timeout=20)
          print('AUTH',auth.status_code,' '.join(auth.text[:250].split())); auth.raise_for_status()
          headers={'Referer':lookup,'Accept':'application/json, text/plain, */*'}

          params={
              'Page':'[{max:25,start:1}]',
              'OrderBy':'[{property:InstrumentDateTime,direction:Desc}]',
              'FilterString':'[{Type:[{Code:C,ID:7},{Code:MF,ID:7},{Code:R,ID:7}]}]',
          }
          r=s.get(urljoin(api,'core/views/instruments'),params=params,headers=headers,timeout=30)
          print('SEARCH_URL',r.url)
          print('SEARCH',r.status_code,r.headers.get('content-type'),'LEN',len(r.text))
          print('BODY_PREFIX',' '.join(r.text[:12000].split()))
          r.raise_for_status()
          payload=r.json()
          print('TOP_KEYS',sorted(payload.keys()) if isinstance(payload,dict) else type(payload).__name__)
          data=payload.get('data') if isinstance(payload,dict) else payload
          if isinstance(data,dict):
              print('DATA_KEYS',sorted(data.keys()))
              lists=[(k,v) for k,v in data.items() if isinstance(v,list)]
              for k,v in lists:
                  print('LIST',k,'COUNT',len(v))
                  for x in v[:15]:
                      if isinstance(x,dict):
                          print('ROW_KEYS',k,sorted(x.keys()))
                          print('ROW',k,json.dumps(x,default=str)[:5000])
                      else:
                          print('ROW',k,repr(x)[:1000])
          elif isinstance(data,list):
              print('DATA_LIST_COUNT',len(data))
              for x in data[:20]:
                  print('ROW_KEYS',sorted(x.keys()) if isinstance(x,dict) else type(x).__name__)
                  print('ROW',json.dumps(x,default=str)[:5000] if isinstance(x,dict) else repr(x)[:1000])
          if r.status_code != 200:
              raise SystemExit('Beaverton instrument query failed')
          PY
