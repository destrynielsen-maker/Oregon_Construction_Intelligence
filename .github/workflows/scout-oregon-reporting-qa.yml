name: Scout Oregon final reporting QA (no deployment)
on:
  push:
    branches: [scout/qa-oregon-reporting-only]
permissions:
  contents: read
jobs:
  report-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: America/Boise
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 19c89f78951ed3af7de06d04037a89832518ac51
          path: candidate
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1b6442561f884e7639b8ecb5309e7e623c94e8ef
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert exact draft and scope
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "19c89f78951ed3af7de06d04037a89832518ac51"
          test "$(git rev-parse HEAD^)" = "1b6442561f884e7639b8ecb5309e7e623c94e8ef"
          test "$(git rev-parse HEAD^^)" = "379115030a2db0f71d27dd0e3db07ca226079b19"
          diff -u <(printf '%s\n' public/index.html src/oregon_permits/dashboard.py src/oregon_permits/pipeline.py src/oregon_permits/reporting.py tests/test_reporting.py) <(git diff --name-only HEAD^^ HEAD)
          git diff --check HEAD^^ HEAD
          echo "f345a637f2a8b025108349196504e73b7d99d5497967708e802352863c1871ba  public/index.html" | sha256sum --check
      - run: python -m pip install -r candidate/requirements.txt
      - name: Unit suite
        working-directory: candidate
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Replay actual CLI from identical history in both lanes
        run: |
          set -euo pipefail
          for lane in baseline candidate; do (cd "$lane"; PYTHONPATH=src python ../scripts/scout_oregon_reporting_replay.py); done
          python scripts/scout_oregon_reporting_parity.py
      - name: Shared status, browser-JS filters and exact CSV identities
        working-directory: candidate
        run: |
          set -euo pipefail
          node ../scripts/scout_oregon_reporting_qa.cjs
          python - <<'PY'
          import csv, json
          from collections import Counter
          records=json.load(open("public/data/permits.json"))["permits"]
          key=lambda p:(p["jurisdiction"],p["permit_number"])
          for fn,n in (("csv-all.csv",9625),("csv-sept.csv",85)):
              with open(fn,encoding="utf-8-sig",newline="") as f: rows=list(csv.DictReader(f))
              expected=records if n==9625 else [p for p in records if "2026-09-01"<=p["issued_date"]<="2026-09-10"]
              assert len(rows)==n and Counter(map(key,rows))==Counter(map(key,expected))
              assert all(p["source_url"] for p in rows)
              print(fn,n,"exact source identities and preserved source links")
          PY
